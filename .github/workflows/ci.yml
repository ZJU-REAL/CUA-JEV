name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite starts a real stdio MCP fixture, so CI must install the MCP extra.
      - run: python -m pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest --cov=cua_jev --cov-report=term-missing
