[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cua-jev"
version = "0.1.0"
description = "A typed, verifiable Jev action router for hybrid computer use"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CUA-JEV contributors" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
windows = ["pywin32>=306", "pywinauto>=0.6.9", "pyautogui>=0.9.54", "openpyxl>=3.1,<4"]
browser = ["playwright>=1.48"]
browser-vision = ["playwright>=1.48", "Pillow>=10,<13"]
mcp = ["mcp>=1,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "Pillow>=10,<13"]
all = ["pywin32>=306", "pywinauto>=0.6.9", "pyautogui>=0.9.54", "openpyxl>=3.1,<4", "playwright>=1.48", "Pillow>=10,<13", "mcp>=1,<2"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
recording = ["Pillow>=10,<13", "numpy>=1.26,<3", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
cua-jev = "cua_jev.cli:main"
cua-jev-ui = "cua_jev.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
