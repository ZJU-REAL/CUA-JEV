<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">The CUA-JEV planning and verification loop</title><desc id="desc">Read clockwise: observe live state, ask a model for grounded intent options, compile legal intent and route pairs, let Jev select one concrete candidate, guard and execute it, then independently verify effect and caller-defined terminal conditions. Re-observe until complete.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="m1 1 6 3.5L1 8" fill="none" stroke="#597477" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1438" height="848" rx="24" fill="#f6f5ef" stroke="#d9ded9" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="64" y="68" font-size="18" font-weight="700" letter-spacing="2.5" fill="#41766c">ARCHITECTURE / A CLOSED VERIFICATION LOOP</text>
<text x="62" y="123" font-size="38" font-weight="700" fill="#132b3b">The model proposes. Jev selects. State proves.</text>
<g fill="none" stroke="#597477" stroke-width="2.5" marker-end="url(#arrow)"><path d="M450 300h40"/><path d="M920 300h40"/><path d="M1165 418v101"/><path d="M970 625h-40"/><path d="M500 625h-40"/><path d="M250 530V428"/></g>
<rect x="60" y="184" width="390" height="234" rx="16" fill="#fff" stroke="#d6ddd9"/>
<text x="88" y="226" font-size="17" font-weight="700" letter-spacing="1.2" fill="#41766c">01 / LIVE OBSERVATION</text>
<text x="88" y="277" font-size="30" font-weight="700" fill="#132b3b">Read the current state</text>
<text x="88" y="321" font-size="21" fill="#4d6270">DOM · accessibility · scoped tools</text>
<text x="88" y="357" font-size="21" fill="#4d6270">Stable refs + freshness fingerprint</text>
<text x="88" y="390" font-size="18" fill="#70818a">Optional, opt-in visual grounding</text>
<rect x="500" y="184" width="420" height="234" rx="16" fill="#fff" stroke="#d6ddd9"/>
<text x="528" y="226" font-size="17" font-weight="700" letter-spacing="1.2" fill="#41766c">02 / MODEL PLANNER</text>
<text x="528" y="277" font-size="30" font-weight="700" fill="#132b3b">Propose grounded intent</text>
<text x="528" y="321" font-size="21" fill="#4d6270">A subgoal + current-ref options</text>
<text x="528" y="357" font-size="21" fill="#4d6270">Bounded, typed operations</text>
<text x="528" y="390" font-size="18" fill="#70818a">No prewritten multi-step click sequence</text>
<rect x="970" y="184" width="410" height="234" rx="16" fill="#fff" stroke="#d6ddd9"/>
<text x="998" y="226" font-size="17" font-weight="700" letter-spacing="1.2" fill="#41766c">03 / FRAMEWORK</text>
<text x="998" y="277" font-size="30" font-weight="700" fill="#132b3b">Compile legal candidates</text>
<text x="998" y="321" font-size="21" fill="#4d6270">Grounded intent × executable route</text>
<text x="998" y="357" font-size="21" fill="#4d6270">GUI / DOM / AX / CLI / MCP / API</text>
<text x="998" y="390" font-size="18" fill="#70818a">Only routes offered by the active surface</text>
<rect x="970" y="530" width="410" height="234" rx="16" fill="#132b3b" stroke="#d6ddd9"/>
<text x="998" y="572" font-size="17" font-weight="700" letter-spacing="1.2" fill="#88d8c7">04 / JEV CHOICE</text>
<text x="998" y="623" font-size="30" font-weight="700" fill="#fff">Choose one action + route</text>
<text x="998" y="667" font-size="21" fill="#d4e5e7">Typed candidate ID + route</text>
<text x="998" y="703" font-size="21" fill="#d4e5e7">Arguments already constrained</text>
<text x="998" y="736" font-size="18" fill="#88d8c7">Jev neither reads pixels nor writes scripts</text>
<rect x="500" y="530" width="420" height="234" rx="16" fill="#fff" stroke="#d6ddd9"/>
<text x="528" y="572" font-size="17" font-weight="700" letter-spacing="1.2" fill="#41766c">05 / RUNTIME</text>
<text x="528" y="623" font-size="30" font-weight="700" fill="#132b3b">Guard, then execute</text>
<text x="528" y="667" font-size="21" fill="#4d6270">Freshness · identity · scope · risk</text>
<text x="528" y="703" font-size="21" fill="#4d6270">Dispatch to a registered executor</text>
<text x="528" y="736" font-size="18" fill="#70818a">A receipt still needs verification</text>
<rect x="60" y="530" width="390" height="234" rx="16" fill="#e2eee8" stroke="#9ec6b8"/>
<text x="88" y="572" font-size="17" font-weight="700" letter-spacing="1.2" fill="#41766c">06 / INDEPENDENT VERIFIER</text>
<text x="88" y="623" font-size="30" font-weight="700" fill="#132b3b">Check real evidence</text>
<text x="88" y="667" font-size="21" fill="#4d6270">Read back effect + terminal gates</text>
<text x="88" y="703" font-size="21" fill="#4d6270">Trace choice, timing, and outcome</text>
<text x="88" y="736" font-size="18" fill="#70818a">Re-observe until independently complete</text>
<text x="720" y="482" text-anchor="middle" font-size="20" fill="#597477">The next action depends on observed results, not a model's claim of success.</text>
<text x="64" y="812" font-size="17" fill="#70818a">Conceptual open-task path · Available routes and verification strength depend on the selected adapter.</text>
</g></svg>
