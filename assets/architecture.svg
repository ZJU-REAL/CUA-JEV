<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">CUA-JEV verified decision loop</title>
  <desc id="desc">A task adapter observes structured state and proposes typed actions. Jev selects an intent and action channel. A guarded runtime executes the action, and an independent verifier returns evidence for the next decision.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f4f9fc"/></linearGradient>
    <linearGradient id="jev" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#126dff"/><stop offset="1" stop-color="#174d8d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1b4570" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M1 1l5 2.5L1 6" fill="none" stroke="#50718d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="1" y="1" width="958" height="368" rx="22" fill="url(#canvas)" stroke="#d4e4f0" stroke-width="2"/>
  <text x="30" y="42" fill="#49657e" font-size="14" font-weight="700" font-family="Arial, sans-serif" letter-spacing="2">CUA-JEV / VERIFIED DECISION LOOP</text>

  <g filter="url(#shadow)">
    <rect x="30" y="70" width="200" height="200" rx="18" fill="#fff" stroke="#c9dce9"/>
    <rect x="258" y="66" width="260" height="208" rx="20" fill="url(#jev)"/>
    <rect x="546" y="70" width="180" height="200" rx="18" fill="#fff" stroke="#c9dce9"/>
    <rect x="754" y="70" width="176" height="200" rx="18" fill="#eaf8f2" stroke="#bddfce"/>
  </g>

  <path d="M236 170h15" fill="none" stroke="#50718d" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M524 170h15" fill="none" stroke="#50718d" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M732 170h15" fill="none" stroke="#50718d" stroke-width="2.3" marker-end="url(#arrow)"/>

  <text x="50" y="109" fill="#945c42" font-size="13" font-weight="700" font-family="Arial, sans-serif">01 / TASK ADAPTER</text>
  <text x="50" y="151" fill="#163954" font-size="27" font-weight="700" font-family="Georgia, serif">Observe</text>
  <text x="50" y="187" fill="#425d72" font-size="16" font-family="Arial, sans-serif">Structured state</text>
  <text x="50" y="213" fill="#425d72" font-size="16" font-family="Arial, sans-serif">+ legal candidates</text>

  <text x="282" y="108" fill="#d1f8ed" font-size="13" font-weight="700" font-family="Arial, sans-serif" letter-spacing="1.2">02 / FAST TYPED DECISION</text>
  <text x="282" y="163" fill="#fff" font-size="52" font-weight="700" font-family="Georgia, serif">JEV</text>
  <text x="282" y="202" fill="#fff" font-size="19" font-weight="700" font-family="Arial, sans-serif">Choose intent × route</text>
  <text x="282" y="232" fill="#e2f0ff" font-size="16" font-family="Arial, sans-serif">One executable action</text>

  <text x="563" y="109" fill="#945c42" font-size="13" font-weight="700" font-family="Arial, sans-serif">03 / RUNTIME</text>
  <text x="563" y="151" fill="#163954" font-size="26" font-weight="700" font-family="Georgia, serif">Execute</text>
  <text x="563" y="187" fill="#425d72" font-size="15" font-family="Arial, sans-serif">Guard + dispatch</text>
  <text x="563" y="213" fill="#425d72" font-size="15" font-family="Arial, sans-serif">GUI / structured</text>

  <text x="771" y="109" fill="#30795c" font-size="13" font-weight="700" font-family="Arial, sans-serif">04 / VERIFIER</text>
  <text x="771" y="151" fill="#163954" font-size="26" font-weight="700" font-family="Georgia, serif">Verify</text>
  <text x="771" y="187" fill="#425d72" font-size="15" font-family="Arial, sans-serif">Check new state</text>
  <text x="771" y="213" fill="#425d72" font-size="15" font-family="Arial, sans-serif">Record evidence</text>

  <path d="M842 280v39H130v-39" fill="none" stroke="#8fb6b0" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <rect x="321" y="300" width="318" height="38" rx="19" fill="#fff" stroke="#d3e3ec"/>
  <text x="480" y="324" text-anchor="middle" fill="#315a70" font-size="14" font-weight="700" font-family="Arial, sans-serif" letter-spacing=".8">VERIFIED STATE → NEXT DECISION</text>
</svg>
